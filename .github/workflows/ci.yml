# MyBlog V2 持续集成（CI）工作流。
# 覆盖当前进入主线维护面的最小稳定检查：v2 后端 + admin 前台 + blog 前台。

name: CI

# 触发时机：
# - 向 main 发起 PR：合并前必须通过。
# - 向 main 推送：合并后再次校验。
# - workflow_dispatch：允许在 GitHub 页面手动跑一次，用于排查。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容。CI 不做发布、不写 issue、不写 PR 评论。
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 后端主 job：v2 后端的 H2 + 单元测试，快速反馈用。
  # 排除五个 MySql*Test（需要真 MySQL 容器），交给下面的 backend-mysql-test。
  # ==========================================================================
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    # 时区固定 Asia/Tokyo，保证与时间相关的断言（如登录审计、发布计划）
    # 在 CI 和本地行为一致。JVM 用 -Duser.timezone，shell 用 TZ。
    env:
      MAVEN_OPTS: -Duser.timezone=Asia/Tokyo
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # 缓存 Maven 依赖，加速后续 job；缓存 key 由 setup-java 内部按 pom.xml 生成。
          cache: maven

      # -Dtest=!... 排除五个真实 MySQL 集成测试，避免主 job 依赖 Docker。
      # 用双引号包住整个参数是为了防止 shell 把 ! 当历史扩展。
      - name: Run backend tests
        run: mvn -f MyBlog-springboot-v2/pom.xml test "-Dtest=!MySqlFlywayMigrationTest,!MySqlChangePasswordConcurrencyTest,!MySqlLoginFailureConcurrencyTest,!MySqlCommentModerationConcurrencyTest,!MySqlHomepageSlotConcurrencyTest"

  # ==========================================================================
  # 后端 MySQL 集成 job：跑五个基于 Testcontainers MySQL 8.4 的专项测试。
  # 覆盖真实 MySQL 方言、行锁、并发条件更新等只在真 MySQL 上暴露的问题。
  # 当前边界见 docs/handbook/ops/ci-cd.md。
  # ==========================================================================
  backend-mysql-test:
    name: Backend MySQL integration tests
    runs-on: ubuntu-latest
    # 硬上限，防止 Testcontainers 挂死占用 Actions 额度。
    timeout-minutes: 15
    env:
      MAVEN_OPTS: -Duser.timezone=Asia/Tokyo
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 提前拉镜像，把网络失败与测试失败分离：这一步挂了就一眼看出是镜像/网络问题。
      # runner 自带 Docker，无需额外安装。
      - name: Pre-pull MySQL image
        run: docker pull mysql:8.4

      - name: Run MySQL integration tests
        run: mvn -f MyBlog-springboot-v2/pom.xml test "-Dtest=MySqlFlywayMigrationTest,MySqlChangePasswordConcurrencyTest,MySqlLoginFailureConcurrencyTest,MySqlCommentModerationConcurrencyTest,MySqlHomepageSlotConcurrencyTest"

  # ===========================================================================
  # Linux PowerShell 初始化 job：先跑进程替身合约，再在 MySQL 8.4 上跑完整链路。
  # ===========================================================================
  mysql-initialization-contract:
    name: Linux MySQL initialization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: contract-password
          MYSQL_DATABASE: myblog_v2_dev
          MYSQL_USER: myblog
          MYSQL_PASSWORD: contract-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYBLOG_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/myblog_v2_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Tokyo&forceConnectionTimeToSession=true&sessionVariables=time_zone='%2B09:00'
      MYBLOG_DATASOURCE_USERNAME: myblog
      MYBLOG_DATASOURCE_PASSWORD: contract-password
      MYBLOG_JWT_SECRET: local-mysql-contract-jwt-secret-1234567890
      MYBLOG_STATS_HASH_SECRET: local-mysql-contract-stats-secret
      MYBLOG_STORAGE_LOCAL_ROOT: /tmp/myblog-v2-uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Run initialization contract
        shell: pwsh
        run: pwsh -NoProfile -File MyBlog-springboot-v2/scripts/dev/mysql/initialize.contract-test.ps1

      - name: Run initialization against MySQL 8.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MYSQL_PWD = $env:MYBLOG_DATASOURCE_PASSWORD
          $mysql = @(
            "--protocol=TCP",
            "--host=127.0.0.1",
            "--port=3306",
            "--user=myblog",
            "--batch",
            "--raw",
            "--skip-column-names"
          )
          $initialize = "MyBlog-springboot-v2/scripts/dev/mysql/initialize.ps1"

          function Invoke-InitializeSuccessfully {
            param([string[]]$Arguments = @())

            pwsh -NoProfile -File $initialize @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Initialization failed: $($Arguments -join ' ')"
            }
          }

          Invoke-InitializeSuccessfully
          Invoke-InitializeSuccessfully @("-Reset")

          $repeatOutput = pwsh -NoProfile -File $initialize 2>&1
          $repeatText = $repeatOutput -join [Environment]::NewLine
          if ($LASTEXITCODE -eq 0 -or $repeatText -notmatch "active") {
            throw "Repeated initialization must refuse active seed data"
          }

          Invoke-InitializeSuccessfully @("-Reset", "-SkipSeed")
          $emptyCount = mysql @mysql myblog_v2_dev --execute="SELECT (SELECT COUNT(*) FROM t_user_auth WHERE deleted = 0) + (SELECT COUNT(*) FROM t_article WHERE deleted = 0)"
          if ($emptyCount -ne "0") {
            throw "SkipSeed must leave migrated tables without active seed rows"
          }

          Invoke-InitializeSuccessfully

  # ===========================================================================
  # 部署工作流合约：防止镜像发布、OIDC、临时 SSH 放行和公网冒烟配置漂移。
  # ===========================================================================
  deployment-workflow-contract:
    name: Deployment workflow contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify deployment workflow
        run: bash deploy/cd/test/workflow-contract-test.sh .github/workflows/images.yml

      - name: Verify Caddy security headers
        run: bash deploy/web/test/security-headers-contract-test.sh deploy/web/Caddyfile

      - name: Validate Caddy configuration
        run: |
          CADDY_IMAGE="$(awk '/^FROM caddy:/ { print $2 }' deploy/web/Dockerfile)"
          docker run --rm \
            --env BLOG_HOST=blog.example \
            --env WWW_HOST=www.blog.example \
            --env ADMIN_HOST=admin.blog.example \
            --volume "$PWD/deploy/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # 后台 admin 前端 job：TypeScript 类型检查 + Vitest。
  # admin 的 package.json 里 "test" 已配成 vitest run，CI 可直接用。
  # ==========================================================================
  admin-frontend-test:
    name: Admin frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 版本固定 9.15.9，与仓库 packageManager 字段对齐，避免 lockfile 兼容问题。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # 按 admin 目录的 pnpm-lock.yaml 生成缓存 key，独立于 blog。
          cache: pnpm
          cache-dependency-path: frontend/apps/admin/pnpm-lock.yaml

      # --frozen-lockfile：严格按 lockfile 装，禁止自动更新，防止无意间引入新版本。
      - name: Install admin dependencies
        run: pnpm --dir frontend/apps/admin install --frozen-lockfile

      - name: Typecheck admin
        run: pnpm --dir frontend/apps/admin typecheck

      - name: Test admin
        run: pnpm --dir frontend/apps/admin test

      - name: Build admin
        run: pnpm --dir frontend/apps/admin build

      - name: Check admin entry bundle budget
        run: pnpm --dir frontend/apps/admin check:bundle-budget

  # ==========================================================================
  # 前台 blog 前端 job：ESLint + TypeScript 类型检查 + Vitest + production build。
  # 结构和 admin 对称。
  # ==========================================================================
  blog-frontend-test:
    name: Blog frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/apps/blog/pnpm-lock.yaml

      - name: Install blog dependencies
        run: pnpm --dir frontend/apps/blog install --frozen-lockfile

      - name: Lint blog
        run: pnpm --dir frontend/apps/blog lint

      - name: Typecheck blog
        run: pnpm --dir frontend/apps/blog typecheck

      - name: Test blog
        run: pnpm --dir frontend/apps/blog test

      - name: Build blog
        run: pnpm --dir frontend/apps/blog build
